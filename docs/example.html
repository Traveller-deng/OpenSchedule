    --study:#42586e; --research:#7c4a63; --life:#5f7a4f; --rest:#8b8a82;

    --lw:292px; --rw:344px; --draft-h:210px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","Source Han Serif SC",
            "Noto Serif CJK SC","Noto Serif SC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --whisper:0 4px 24px rgba(20,20,19,.05);
    --ring-1:0 0 0 1px var(--ring);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;color:var(--ink)}
  a{color:var(--terra-d);text-underline-offset:2px}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.005em}
  ::selection{background:#f0d9ce;color:var(--ink)}
  *::-webkit-scrollbar{width:9px;height:9px}
  *::-webkit-scrollbar-thumb{background:#d9d6ca;border-radius:99px;border:2px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:#c2bfb2;background-clip:content-box}
  *::-webkit-scrollbar-track{background:transparent}

  .app{display:grid;grid-template-columns:var(--lw) 1fr var(--rw);min-height:100vh;
    transition:grid-template-columns .22s cubic-bezier(.3,.7,.2,1)}
  .app.lc{--lw:64px}
  .app.rc{--rw:0px}

  /* ============================ 左右栏公共 ============================ */
  .handle{position:absolute;top:50%;transform:translateY(-50%);z-index:40;
    width:26px;height:56px;padding:0;line-height:1;
    display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:9px;
    background:rgba(255,255,255,.55);
    color:var(--olive);opacity:.55;
    transition:opacity .18s ease,background .18s ease,border-color .18s ease,
               box-shadow .18s ease,color .18s ease,transform .18s ease}
  .handle svg{width:13px;height:13px;fill:currentColor;stroke:currentColor;stroke-width:1;
    stroke-linejoin:round;transition:transform .24s cubic-bezier(.3,.7,.2,1)}
  .handle:hover,.handle:focus-visible{opacity:1;color:var(--ink);background:#fff;
    border-color:var(--line);box-shadow:0 4px 18px rgba(20,20,19,.12);outline:none}
  .left .handle{right:-15px}
  .left .handle:hover{transform:translateY(-50%) translateX(2px)}
  .right .handle{left:-15px}
  .right .handle:hover{transform:translateY(-50%) translateX(-2px)}
  .app.rc .right .handle{left:auto;right:4px}
  /* 收起左栏时，箭头与「选中的日期竖线」同高 */
  .app.lc .left .handle{top:var(--handle-y,50%)}

  .resizer{position:absolute;top:0;bottom:0;width:10px;cursor:col-resize;z-index:30;background:transparent;
    touch-action:none}
  .resL{right:-5px}
  .resR{left:-5px}
  .resizer::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;
    background:var(--terra);opacity:0;transform:translateX(-.5px);transition:opacity .15s}
  .resizer:hover::after,.resizer.dragging::after{opacity:.5}
  .app.lc .resL,.app.rc .resR{display:none}
  body.col-resizing{cursor:col-resize!important;user-select:none}
  body.row-resizing{cursor:row-resize!important;user-select:none}

  /* ============================ 左栏 ============================ */
  .left{background:var(--ivory);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
    overflow:visible;display:flex;flex-direction:column}
  .lhead{display:flex;align-items:center;gap:9px;padding:20px 20px 12px;flex:0 0 auto}
  .lhead .dot{width:8px;height:8px;border-radius:50%;background:var(--terra);flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(201,100,66,.16)}
  .lhead h1{font-size:16px;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;color:var(--ink)}
  .lhead small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--stone);font-weight:400;margin-top:2px}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:27px;height:27px;line-height:1;
    color:var(--olive);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;
    transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
  .iconbtn:hover{background:var(--ivory);color:var(--ink);box-shadow:var(--ring-1)}
  .iconbtn.del:hover{background:#fbeaea;color:var(--crimson);border-color:#eccfcf}
  .lbody{flex:1 1 auto;min-height:0;overflow:auto;padding:0 20px 14px}
  .lfoot{flex:0 0 auto;height:min(var(--chat-h,250px), 55vh);min-height:120px;border-top:1px solid var(--cream);
    padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .splitL{flex:0 0 auto;height:10px;position:relative;cursor:row-resize;touch-action:none}
  .splitL::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:1px;background:var(--cream);
    transform:translateY(-.5px);transition:background .15s}
  .splitL i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:3px;
    border-radius:99px;background:var(--ring);opacity:0;transition:opacity .15s}
  .splitL:hover::before,.splitL.dragging::before{background:var(--ring)}
  .splitL:hover i,.splitL.dragging i{opacity:1}
  .app.lc .splitL{display:none}
  /* 日志区吃掉剩余高度，输入行永远贴在最下面 */
  /* 用 margin-top:auto 把消息顶到底部；不能用 justify-content:flex-end，
     那样溢出的部分滚不到（Chrome 会把溢出内容裁在滚动起点之外） */
  .chatlog{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;font-size:12.2px;line-height:1.6;
    color:var(--olive);display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
  .chatlog > :first-child{margin-top:auto}
  .chatlog::-webkit-scrollbar{width:7px}
  .msg{padding:6px 9px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .msg.me{background:var(--sand);color:var(--ink2);align-self:flex-end;max-width:88%}
  .msg.bot{background:#fff;border:1px solid var(--cream);color:var(--ink2);max-width:100%}
  .msg.err{background:#fbeaea;border:1px solid #eccfcf;color:var(--crimson)}
  .chatrow{flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .chatrow input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:10px;
    font-size:12.5px;background:#fff;color:var(--ink);transition:border-color .14s,box-shadow .14s}
  .chatrow input:focus{outline:none;border-color:#dfa892;box-shadow:0 0 0 3px rgba(201,100,66,.13)}
  .chatrow button{border:1px solid var(--line);background:var(--sand);border-radius:10px;width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;color:var(--olive);font-size:13px;line-height:1;padding:0;
    transition:background .12s,color .12s,border-color .12s}
  .chatrow button:hover{background:var(--sand2);color:var(--ink);border-color:var(--ring)}
  .chatrow button.send{background:var(--terra);border-color:var(--terra);color:#fff}
  .chatrow button.send:hover{background:var(--terra-d);border-color:var(--terra-d)}
  .chatrow button:disabled{opacity:.5;cursor:default}
  .app.lc .lfoot,.app.lc .lbot{display:none}
  .todayline{margin:2px 0 16px;padding:11px 13px;background:var(--sand);border:1px solid var(--cream);
    border-radius:12px;font-size:12.5px;line-height:1.65;color:var(--olive)}
  .todayline b{display:block;font-family:var(--serif);color:var(--ink);font-size:13.5px;letter-spacing:.01em}
  .todayline .hint{display:block;margin-top:1px;font-size:11.5px;color:var(--silver)}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calhead .t{font-family:var(--serif);font-size:15px;color:var(--ink)}
  .navbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:26px;line-height:1;
    color:var(--olive);transition:background .12s,box-shadow .12s,color .12s}
  .navbtn:hover{background:var(--ivory);color:var(--ink);box-shadow:var(--ring-1)}
  table.cal{width:100%;border-collapse:collapse}
  table.cal th{font-size:10.5px;color:var(--stone);font-weight:400;letter-spacing:.1em;padding:4px 0 6px}
  table.cal td{text-align:center;padding:1.5px 0}
  .dcell{width:30px;height:30px;border:0;background:transparent;border-radius:10px;color:var(--ink2);
    font-size:12.5px;position:relative;padding:0;font-variant-numeric:tabular-nums;
    transition:background .12s,color .12s,box-shadow .12s}
  .dcell:hover{background:var(--sand);color:var(--ink)}
  .dcell.out{color:#cbc9bf;padding:0;background:transparent}
  .dcell.has{background:var(--sand)}
  .dcell.today{background:#f7e6de;color:var(--terra-d);font-weight:600}
  .dcell.today:hover{background:#f3dccf}
  .dcell.dl::after{content:"";position:absolute;left:50%;bottom:3px;width:3px;height:3px;border-radius:50%;
    background:var(--crimson);transform:translateX(-50%)}
  .dcell.sel.dl::after{background:#f3c3b6}
  .dcell.sel{background:var(--ink);color:var(--ivory);font-weight:500;box-shadow:0 2px 10px rgba(20,20,19,.18)}
  .dcell.sel:hover{background:var(--ink)}
  .dcell.sel.today{background:var(--terra);color:#fff}
  .dcell.sel.dl{background:var(--ink);color:var(--ivory)}

  /* ===== 收起态：歌词式竖排日号 ===== */
  .app.lc .lhead,.app.lc .todayline,.app.lc .wide,.app.lc .lbot{display:none}
  .app.lc .lbody{padding:10px 6px 6px;overflow:hidden;display:flex;min-height:0}
  .strip{display:none;position:relative;flex:1 1 auto;min-height:0;flex-direction:column;align-items:stretch}
  .app.lc .strip{display:flex}
  .smonth{flex:0 0 auto;text-align:center;font-family:var(--serif);font-size:11.5px;letter-spacing:.1em;
    color:var(--stone);padding:2px 0 8px}
  .slist{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:none;overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%)}
  .slist::-webkit-scrollbar{display:none}
  /* 居中那一天的标记竖条：纵向位置由 JS 跟着选中项算，保证和数字等高对齐 */
  .strip::after{content:"";position:absolute;left:1px;top:var(--bar-y,50%);transform:translateY(-50%);
    width:2px;height:22px;background:var(--terra);border-radius:2px;opacity:.8;pointer-events:none}
  .sitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    width:100%;height:56px;border:0;background:transparent;padding:0;
    opacity:calc(.12 + .88*var(--f,0));transform:scale(calc(.86 + .14*var(--f,0)));
    will-change:opacity,transform}
  /* 数字：没安排=淡灰，有安排=墨黑；今天=赤陶；居中选中=更大更粗 */
  .sitem .dnum{display:flex;align-items:center;justify-content:center;height:22px;font-size:15px;
    line-height:22px;font-variant-numeric:tabular-nums;color:var(--stone);letter-spacing:0;
    transition:color .12s}
  .sitem.has .dnum{color:var(--ink)}
  .sitem.today .dnum{color:var(--terra);font-weight:600}
  .sitem.sel .dnum{color:var(--ink);font-weight:600;font-size:19px;line-height:22px}
  .sitem.sel.today .dnum{color:var(--terra-d)}
  /* 星期：不加字距，flex 居中，两侧用红点表示这天有截止 */
  .sitem .dwk{display:flex;align-items:center;gap:3px;font-size:9px;line-height:1;
    letter-spacing:0;color:var(--silver);opacity:calc(var(--f,0)*.95)}
  .sitem.due .dwk::before,.sitem.due .dwk::after{content:"";width:3px;height:3px;border-radius:50%;
    background:var(--crimson);flex:0 0 auto}
  .sitem.sel .dwk{color:var(--terra-d)}

  /* ============================ 主区 ============================ */
  main{padding:34px 44px 80px;max-width:1120px;min-width:0}
  .dayhead{margin-bottom:4px}
  .dayhead h2{margin:0;font-size:31px;line-height:1.18;letter-spacing:-.015em;color:var(--ink);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .dayhead h2 small{font-family:var(--sans);font-size:13px;color:var(--stone);font-weight:400;letter-spacing:.06em}
  .dayhead .tag{font-size:11px}

  .chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:3px 11px;font-size:12.2px;color:var(--olive);line-height:1.5;
    transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
  .chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .chip.act{cursor:pointer}
  .chip.act:hover{border-color:var(--ring);background:var(--ivory);color:var(--ink);box-shadow:var(--ring-1)}
  .chip.prog{background:var(--sand);border-color:var(--cream);color:var(--olive);font-variant-numeric:tabular-nums}
  .chip.prog b{color:var(--terra-d)}
  .chip.prog.all{background:#ecefdd;border-color:#dfe4cc;color:#5b6a38}
  .chip.prog.all b{color:#4f5d30}

  /* 类型胶囊：颜色永远和名字在一起 */
  .tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:11.4px;
    line-height:1.55;padding:1px 9px;border-radius:999px;border:1px solid transparent;font-weight:500;
    letter-spacing:.02em;white-space:nowrap;vertical-align:middle}
  .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;
    flex:0 0 auto;opacity:.85}
  .k-study{background:#e9edf1;color:var(--study);border-color:#d8e0e7}
  .k-research{background:#f4e9ee;color:var(--research);border-color:#e8d4dd}
  .k-life{background:#edf0de;color:var(--life);border-color:#dee3ca}
  .k-rest{background:#f0efe9;color:var(--rest);border-color:#e3e1d9}
  .tag.today-tag{background:#f9e8df;color:var(--terra-d);border-color:#f2d8c9}
  .tag.today-tag::before{display:none}

  .cells{display:flex;flex-direction:column}
  .cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
    display:grid;grid-template-columns:114px 1fr;overflow:hidden;
    transition:box-shadow .14s,border-color .14s}
  .cell:hover{box-shadow:var(--whisper),var(--ring-1);border-color:var(--ring)}
  .cell{cursor:grab}
  .cell.dragging{cursor:grabbing;opacity:.82;border-color:var(--terra);
    box-shadow:var(--whisper),var(--ring-1);user-select:none}
  .cell.hasconflict{border-color:#e8bcbc}
  .cell .tcol{background:var(--sand);padding:16px 14px;display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--cream);position:relative}
  .cell .tcol b{font-size:15.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .cell .tcol span{font-size:11.5px;color:var(--stone);margin-top:3px;font-variant-numeric:tabular-nums}
  .cell .tcol .k{position:absolute;left:0;top:0;bottom:0;width:3px}
  .cell .cbody{padding:15px 18px 16px;position:relative}
  .cell .chead{display:flex;align-items:flex-start;gap:12px}
  .cell .chead h3{margin:0;font-family:var(--serif);font-size:16px;line-height:1.4;letter-spacing:.002em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;color:var(--ink)}
  .cell .cact{display:flex;gap:5px;opacity:0;transition:opacity .14s}
  .cell:hover .cact,.cell:focus-within .cact{opacity:1}
  .cell .cbody p{margin:7px 0 0;font-size:13.5px;line-height:1.65;color:var(--olive)}
  ul.mini{margin:8px 0 0;padding-left:18px;font-size:13.2px;color:var(--olive);line-height:1.65}
  ul.mini li{margin:2.5px 0}
  ul.mini li::marker{color:var(--silver)}
  .output{margin-top:11px;font-size:12.8px;background:var(--ivory);border:1px solid var(--cream);
    border-radius:10px;padding:8px 12px;color:var(--olive)}
  .output b{color:var(--ink2);font-weight:500}
  .edited{font-size:10.5px;letter-spacing:.03em;color:var(--study);background:#e9edf1;border:1px solid #d8e0e7;
    border-radius:6px;padding:1px 7px;font-family:var(--sans)}
  .lnk{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.4px;text-decoration:none;
    color:var(--terra-d);background:#f9ece5;border:1px solid #f0d9cc;border-radius:9px;padding:4px 11px;max-width:100%;
    transition:background .12s,border-color .12s}
  .lnk:hover{background:#f5e2d8;border-color:#e8c8b7;color:#8d4527}
  .lkb{font-style:normal;font-family:var(--sans);font-size:9.4px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--terra-d);background:#f4e5dc;border-radius:4px;
    padding:1.5px 5px;flex:0 0 auto}
  .lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .corner{position:absolute;right:14px;top:11px;font-size:11.6px;color:var(--crimson);font-weight:500;
    background:#fbeaea;border:1px solid #eccfcf;border-radius:999px;padding:2px 10px;max-width:56%;text-align:right}
  .cell.hasconflict .chead{padding-right:190px}

  .ins{height:24px;display:flex;align-items:center;justify-content:center;position:relative}
  .ins .plus{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--stone);font-size:12.5px;line-height:1;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .14s,transform .14s,border-color .14s,color .14s;padding:0;
    box-shadow:0 1px 4px rgba(20,20,19,.06)}
  .ins:hover .plus{opacity:1;transform:scale(1.06);border-color:var(--terra);color:var(--terra)}
  .ins::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:transparent;
    transition:background .14s}
  .ins:hover::before{background:var(--cream)}

  .sechead{display:flex;align-items:center;gap:11px;margin:32px 0 13px}
  .sechead h2{margin:0;font-size:18px;display:flex;align-items:center;gap:11px;flex:1;color:var(--ink)}
  .sechead h2::before{content:"";width:3px;height:16px;background:var(--terra);border-radius:2px}
  .sechead .iconbtn{opacity:.4;transition:opacity .14s}
  .sechead:hover .iconbtn,.sechead:focus-within .iconbtn{opacity:1}

  /* 今日主要任务 */
  .taskbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 9px}
  .taskbar{height:3px;margin:7px 10px 3px;border-radius:99px;background:var(--sand2);overflow:hidden}
  .taskbar i{display:block;height:100%;border-radius:99px;background:var(--terra);
    transition:width .3s cubic-bezier(.25,.8,.3,1)}
  .taskbar.done i{background:var(--moss)}
  .task{display:flex;align-items:flex-start;gap:11px;padding:9px 9px;border-radius:11px;
    border-bottom:1px solid var(--cream);cursor:pointer;transition:background .12s,box-shadow .12s}
  .task:last-child{border-bottom:0}
  .task:hover{background:var(--ivory)}
  .task:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(201,100,66,.16);background:var(--ivory)}
  .task .tkbox{width:16px;height:16px;border:1.5px solid var(--ring);border-radius:5px;flex:0 0 auto;
    margin-top:2px;position:relative;background:#fff;transition:background .14s,border-color .14s}
  .task:hover .tkbox{border-color:var(--terra)}
  .task.done .tkbox{background:var(--terra);border-color:var(--terra)}
  .task.done .tkbox::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
    border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
  .task .tx{flex:1;font-size:14.5px;line-height:1.55;color:var(--ink2);word-break:break-word;transition:color .14s}
  .task.done .tx{color:var(--stone);text-decoration:line-through;text-decoration-thickness:1px;
    text-decoration-color:#cdcabe}
  .task .lnk{margin-top:0;flex:0 0 auto}
  .task .tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .task .tmain .tx{flex:none}
  .task .tlinks{display:flex;flex-wrap:wrap;gap:6px}
  .task .tlinks .lnk{margin-top:0;max-width:100%}
  .tasknone{font-size:13px;color:var(--silver);padding:14px 10px;line-height:1.7}

  .empty{background:var(--card);border:1px dashed var(--ring);border-radius:16px;padding:34px 26px;
    text-align:center;color:var(--olive)}
  .empty h3{margin:0 0 9px;color:var(--ink);font-size:17px}
  .empty p{margin:0;font-size:13.2px;line-height:1.7}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 19px}
  .card h4{margin:0 0 9px;font-size:15px}
  .card p{margin:0;font-size:13.2px;color:var(--olive)}
  .card .bar{height:6px;border-radius:99px;background:var(--sand);overflow:hidden;margin:11px 0 9px}
  .card .bar i{display:block;height:100%;border-radius:99px}

  /* ============================ 右栏 ============================ */
  .right{background:var(--ivory);border-left:1px solid var(--line);height:100vh;position:sticky;top:0;
    display:flex;flex-direction:column;overflow:visible;container-type:inline-size}
  .pane{display:flex;flex-direction:column;min-height:0}
  .paneTop{flex:1 1 auto}
  .paneBottom{flex:0 0 auto;height:var(--draft-h,210px);min-height:110px}
  .tabs{display:flex;align-items:center;gap:3px;padding:14px 14px 0;border-bottom:1px solid var(--line);
    flex:0 0 auto}
  .tab{display:flex;align-items:center;gap:6px;padding:8px 4px 10px;margin-right:14px;border:0;background:none;
    border-bottom:2px solid transparent;font-size:12.8px;color:var(--stone);white-space:nowrap;
    transition:color .12s,border-color .12s}
  .tab:hover{color:var(--ink2)}
  .tab.on{color:var(--ink);border-bottom-color:var(--terra)}
  .rhead{display:flex;align-items:center;gap:7px;padding:16px 18px 10px;flex:0 0 auto}
  .rhead h2{margin:0;font-size:15.5px;flex:1;min-width:0;display:flex;align-items:center;gap:9px;color:var(--ink)}
  .rhead h2 .cnt{flex:0 0 auto;white-space:nowrap;font-family:var(--sans);font-size:11px;font-weight:400;
    color:var(--olive);background:var(--sand);border:1px solid var(--cream);border-radius:99px;padding:1px 9px}
  .rbody{flex:1 1 auto;min-height:0;overflow:auto;padding:0 16px 14px}
  .rhint{font-size:11.5px;color:var(--silver);margin:0 0 8px;line-height:1.6}
  .rfoot{border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:9px;flex:0 0 auto}
  .rfoot .btn{flex:1;text-align:center;padding:7px 9px;font-size:12.2px}
  .btn{border:1px solid var(--line);background:var(--sand);color:var(--ink2);border-radius:10px;
    transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
  .btn:hover{background:var(--sand2);border-color:var(--ring);box-shadow:var(--ring-1);color:var(--ink)}

  .ddl{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 9px;border-radius:11px;
    cursor:pointer;transition:background .12s}
  .ddl:hover{background:var(--sand)}
  .ddl .box{width:15px;height:15px;border:1.5px solid var(--ring);border-radius:5px;flex:0 0 auto;
    margin-top:3px;position:relative;background:#fff;transition:background .14s,border-color .14s}
  .ddl:hover .box{border-color:var(--terra)}
  .ddl.done .box{background:var(--moss);border-color:var(--moss)}
  .ddl.done .box::after{content:"";position:absolute;left:3.7px;top:.5px;width:4px;height:7.5px;
    border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
  .ddl .txt{flex:1;min-width:0;padding-right:2px}
  .ddl .dt{display:block;font-size:11.2px;color:var(--stone);font-variant-numeric:tabular-nums;
    letter-spacing:.04em;line-height:1.5}
  .ddl .tk{display:block;font-size:13px;color:var(--ink2);word-break:break-word;line-height:1.45}
  .ddl.done .tk{color:var(--silver);text-decoration:line-through;text-decoration-color:#d6d3c8}
  .ddl.cur{background:#f7e9e1}
  .ddl.cur .tk{color:var(--ink);font-weight:500}
  .ddl.cur .dt{color:var(--terra-d)}
  /* 任务安排：分组标题 */
  .pgroup{font-size:11.4px;color:var(--stone);letter-spacing:.05em;line-height:1.6;
    margin:14px 0 1px;padding-left:9px;border-left:2px solid var(--cream)}
  .pgroup:first-child{margin-top:2px}
  .ddl.plan .tk{font-size:13px}
  /* 悬浮时才出现，叠在行尾，不占布局宽度 */
  .acts{position:absolute;right:3px;top:50%;transform:translateY(-50%);
    display:flex;gap:1px;padding-left:14px;border-radius:9px;opacity:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(242,240,230,0) 0,var(--sand) 42%);
    transition:opacity .12s}
  .ddl:hover .acts,.rlink:hover .acts,.ddl:focus-within .acts,.rlink:focus-within .acts{opacity:1;pointer-events:auto}
  .acts button{border:0;background:transparent;color:var(--silver);width:21px;height:21px;border-radius:6px;
    font-size:11.5px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .12s,color .12s}
  .acts button:hover{background:#fff;color:var(--ink)}
  .acts button.act-del:hover{color:var(--crimson)}

  .rlink{position:relative;display:flex;align-items:center;border-radius:10px;transition:background .12s}
  .rlink:hover{background:var(--sand)}
  .rl-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:12.8px;
    color:var(--ink2);text-decoration:none}
  .rl-main .ic{width:18px;text-align:center;color:var(--stone);flex:0 0 auto}
  .rl-main .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .minirow{display:flex;align-items:baseline;gap:8px;margin:14px 2px 2px}
  .mini-btn{border:0;background:transparent;padding:0;font-size:11.5px;color:var(--olive);
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ring)}
  .mini-btn:hover{color:var(--terra-d);text-decoration-color:var(--terra)}
  .mini-hint{font-size:10.5px;color:var(--silver);line-height:1.5}

  .splitter{flex:0 0 auto;height:11px;position:relative;cursor:row-resize;touch-action:none}
  .splitter::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:1px;background:var(--cream);
    transform:translateY(-.5px);transition:background .15s}
  .splitter i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:3px;
    border-radius:99px;background:var(--ring);opacity:0;transition:opacity .15s}
  .splitter:hover::before,.splitter.dragging::before{background:var(--ring)}
  .splitter:hover i,.splitter.dragging i{opacity:1}

  .poolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .poolbar select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
    font-size:13px;background:#fff;color:var(--ink)}
  .poolbar .qbtn{flex:0 0 auto;white-space:nowrap}
  .drafthead{display:flex;align-items:baseline;gap:9px;padding:10px 18px 8px;flex:0 0 auto}
  .drafthead h2{margin:0;font-size:15.5px;color:var(--ink)}
  .drafthead span{font-size:11px;color:var(--silver);letter-spacing:.03em}
  .draft{flex:1 1 auto;min-height:0;margin:0 16px 16px;padding:11px 13px;border:1px solid var(--line);
    border-radius:12px;background:#fff;font-size:13px;line-height:1.7;resize:none;color:var(--ink2);
    transition:border-color .14s,box-shadow .14s}
  .draft:focus{outline:none;border-color:#dfa892;box-shadow:0 0 0 3px rgba(201,100,66,.13)}
  .draft::placeholder{color:var(--silver)}

  /* 一次性提示：出现 → 1.8s 后自动消失 */
  #toast{position:fixed;left:50%;bottom:30px;z-index:80;transform:translate(-50%,12px);
    padding:8px 18px;border-radius:999px;background:var(--ink);color:var(--ivory);
    font-size:12.8px;letter-spacing:.02em;box-shadow:0 10px 28px rgba(20,20,19,.24);
    opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* ============================ 弹层 ============================ */
  .mask{position:fixed;inset:0;background:rgba(20,20,19,.42);display:none;align-items:center;
    justify-content:center;padding:22px;z-index:50;backdrop-filter:blur(2px)}
  .mask.on{display:flex}
  .modal{background:var(--ivory);border:1px solid var(--line);border-radius:20px;width:min(620px,100%);
    max-height:88vh;overflow:auto;padding:26px 28px 24px;box-shadow:0 24px 60px rgba(20,20,19,.22)}
  .modal.narrow{width:min(470px,100%)}
  .modal h3{margin:0 0 5px;font-size:20px;color:var(--ink)}
  .modal .mhint{font-size:12.5px;color:var(--olive);margin:0 0 18px;line-height:1.6}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:11.5px;color:var(--olive);margin-bottom:6px;letter-spacing:.03em}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:11px;
    font-size:13.5px;background:#fff;transition:border-color .14s,box-shadow .14s}
  .fld textarea{min-height:70px;resize:vertical;line-height:1.6}
  .fld input:focus,.fld select:focus,.fld textarea:focus,.linkrow input:focus,.linkrow select:focus,.exp:focus{
    outline:none;border-color:#dfa892;box-shadow:0 0 0 3px rgba(201,100,66,.13)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .hkrow{display:flex;gap:8px;align-items:center}
  .hkrow input{flex:1;min-width:0}
  .hkhint{font-size:11.5px;color:var(--silver);margin-top:7px;line-height:1.6}
  .modal .seclabel{font-size:11.5px;letter-spacing:.06em;color:var(--silver);
    margin:18px 0 12px;padding-top:13px;border-top:1px solid var(--cream)}
  .mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .mact button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 18px;font-size:13.5px;
    transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
  .mact button:hover{background:var(--sand);border-color:var(--ring)}
  .mact .primary{background:var(--terra);color:#fff;border-color:var(--terra);box-shadow:0 1px 2px rgba(20,20,19,.12)}
  .mact .primary:hover{background:var(--terra-d);border-color:var(--terra-d);color:#fff}
  .mact .danger{color:var(--crimson);border-color:#eccfcf;background:#fff;margin-right:auto}
  .mact .danger:hover{background:#fbeaea;border-color:#e3bcbc}
  .exp{width:100%;height:210px;font-family:ui-monospace,Consolas,"SF Mono",monospace;font-size:12px;
    line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink2)}
  .quick{margin-bottom:16px;display:flex;flex-wrap:wrap;gap:7px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:11.8px;
    color:var(--olive);font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s,color .12s}
  .quick button:hover{background:var(--sand);border-color:var(--ring);color:var(--ink)}
  .linkrow{display:grid;grid-template-columns:1fr 1.7fr 90px 48px 28px;gap:7px;align-items:center;margin-bottom:7px}
  .linkrow select,.linkrow input{padding:7px 10px;border:1px solid var(--line);border-radius:10px;
    font-size:12.8px;width:100%;min-width:0;background:#fff;transition:border-color .14s,box-shadow .14s}
  .linkrow .rm{border:1px solid var(--line);background:#fff;border-radius:9px;height:31px;color:var(--stone);
    font-size:14px;line-height:1;transition:background .12s,color .12s,border-color .12s}
  .linkrow .rm:hover{background:#fbeaea;color:var(--crimson);border-color:#eccfcf}
  .lk-badge{font-family:var(--sans);font-size:9.2px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--stone);background:transparent;border:1px solid var(--cream);border-radius:7px;
    padding:4px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linkadd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px}
  .qbtn{border:1px dashed var(--ring);background:transparent;border-radius:10px;padding:6px 12px;font-size:12.2px;
    color:var(--olive);transition:border-color .12s,color .12s,background .12s}
  .qbtn:hover{border-color:var(--terra);color:var(--terra);background:#fdf7f4}
  .lkgroup{margin-top:10px;font-size:11.5px;color:var(--stone)}
  .lkgroup b{color:var(--olive);font-weight:500;margin-right:6px}

  /* 宽屏：每个栏各自滚动，滚动条贴着主页面右边，而不是整个窗口最右 */
  @media (min-width:1181px){
    body{overflow:hidden}
    .app{height:100vh;overflow:hidden}
    main{height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
    .left,.right{position:relative;top:auto}
    main::-webkit-scrollbar{width:10px}
    main::-webkit-scrollbar-thumb{background:#ddd9cd;border-radius:99px;border:3px solid transparent;background-clip:content-box}
    main::-webkit-scrollbar-thumb:hover{background:#c8c4b6;background-clip:content-box}
  }

  /* 右栏被拖窄时收紧内部留白（容器查询，跟随实际宽度） */
  @container (max-width: 268px){
    .tabs{padding:12px 10px 0}
    .tab{margin-right:10px;font-size:12.2px}
    .rhead{padding:13px 12px 8px;gap:5px}
    .rhead h2{font-size:14.5px;gap:6px}
    .rhead h2 .cnt{display:none}
    .rbody{padding:0 10px 12px}
    .ddl{padding:8px 7px;gap:8px}
    .rl-main{padding:8px 8px;font-size:12.4px}
    .drafthead{padding:8px 12px 6px}
    .draft{margin:0 10px 12px}
  }

  /* ============================ 响应式 ============================ */
  @media (max-width:1180px){
    .app{grid-template-columns:var(--lw) 1fr}
    .right{grid-column:1 / -1;height:auto;border-left:0;border-top:1px solid var(--line);position:relative}
    .app.rc .right{display:none}
    main{padding:28px 30px 60px}
    .resizer{display:none}
    .splitter{display:none}
    .paneTop{min-height:0}
    .paneBottom{height:auto}
    .draft{min-height:120px}
    .right .handle{top:10px;right:14px;left:auto;transform:none;width:26px;height:26px;opacity:.4}
    .right .handle:hover{transform:none}
    .right .handle svg{width:17px;height:17px}
    .app.rc .right .handle{right:14px}
  }
  @media (max-width:860px){
    .app{grid-template-columns:var(--lw) 1fr}
    .left{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .lbody{overflow:visible}
    .lbot{display:none}
    .dayhead h2{font-size:25px}
    main{padding:22px 16px 64px}
    .cell{grid-template-columns:1fr}
    .cell .tcol{flex-direction:row;gap:9px;align-items:baseline;border-right:none;border-bottom:1px solid var(--cream);
      padding:11px 14px}
    .cell .tcol span{margin-top:0}
    .cell .tcol .k{width:100%;height:3px;bottom:auto;right:0}
    .cell.hasconflict .chead{padding-right:0}
    .corner{position:static;display:inline-block;margin-top:9px;max-width:none}
    .strip{height:280px}
    .linkrow{grid-template-columns:1fr 1fr}
    .linkrow .rm{grid-column:2;justify-self:end}
  }
  @media print{
    .left,.right,.iconbtn,.ins,.mact,.mask,.handle,.chip.act,.taskbar{display:none!important}
    body{background:#fff}
    main{padding:0;max-width:none}
    .cell{break-inside:avoid;box-shadow:none!important}
    .task .tkbox{border-color:#bbb}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ========== LEFT ========== -->
  <aside class="left" id="left">
    <button class="handle hl" id="handleL" title="展开日期栏" aria-label="展开日期栏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8.5 4.5 19 12 8.5 19.5"/></svg>
    </button>
    <div class="resizer resL" id="resizeL" title="拖动调节宽度"></div>

    <div class="lhead">
      <span class="dot"></span>
      <h1>OpenSchedule<small>每日安排</small></h1>
    </div>

    <div class="lbody">
      <div class="todayline" id="todayline"></div>

      <div class="wide">
        <div class="calhead">
          <div class="t" id="calTitle">—</div>
          <div style="display:flex;gap:5px">
            <button class="navbtn" id="prevM" title="上个月">‹</button>
            <button class="navbtn" id="todayBtn" title="回到今天">今</button>
            <button class="navbtn" id="nextM" title="下个月">›</button>
          </div>
        </div>
        <table class="cal">
          <thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead>
          <tbody id="calBody"></tbody>
        </table>
      </div>

      <div class="strip" id="strip">
        <div class="smonth" id="smonth">—</div>
        <div class="slist" id="slist"></div>
      </div>
    </div>

    <div class="splitter splitL" id="chatSplit" title="拖动调节助手高度"><i></i></div>

    <!-- 日程助手 -->
    <div class="lfoot" id="lfoot">
      <div class="chatlog" id="chatlog"></div>
      <form class="chatrow" id="chatform" autocomplete="off">
        <input id="chatinput" placeholder="问安排上的事…" maxlength="800">
        <button class="send" type="submit" title="发送">↑</button>
        <button type="button" id="chatcfg" title="配置模型供应商">⚙</button>
      </form>
    </div>
  </aside>

  <!-- ========== MAIN ========== -->
  <main id="main"></main>

  <!-- ========== RIGHT ========== -->
  <aside class="right" id="right">
    <div class="resizer resR" id="resizeR" title="拖动调节宽度"></div>

    <section class="pane paneTop" id="paneTop">
      <div class="tabs" id="tabs"></div>
      <div class="rhead" id="rhead"></div>
      <div class="rbody" id="rbody"></div>
    </section>

    <div class="splitter" id="splitter" title="拖动调节上下高度"><i></i></div>

    <section class="pane paneBottom" id="paneBottom">
      <div class="drafthead"><h2>草稿</h2></div>
      <textarea class="draft" id="draft" placeholder="想到什么就写这儿：要调整的安排、新需求、待办…（自动保存）"></textarea>
    </section>

    <button class="handle hr" id="handleR" title="收起侧边栏" aria-label="收起侧边栏">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8.5 4.5 19 12 8.5 19.5"/></svg>
    </button>
  </aside>
</div>

<!-- ========== 安排 编辑 ========== -->
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">添加安排</h3>
    <p class="mhint" id="mHint"></p>
    <div class="quick" id="quick">
      <button data-q="15:00|1h">15:00 · 1h</button>
      <button data-q="16:00|1h">16:00 · 1h</button>
      <button data-q="20:00|2h">20:00 · 2h</button>
      <button data-q="20:00|1h30">20:00 · 1h30</button>
      <button data-q="09:30|2h">09:30 · 2h</button>
    </div>
    <div class="frow">
      <div class="fld"><label>开始时间</label><input id="fTime" placeholder="例：20:00"></div>
      <div class="fld"><label>持续时长</label><input id="fDur" placeholder="例：2h / 1h30 / 45min"></div>
    </div>
    <div class="fld"><label>事项</label><input id="fTitle" placeholder="做什么"></div>
    <div class="fld"><label>类型</label>
      <select id="fType">
        <option value="study">学习</option>
        <option value="life">生活</option>
        <option value="research">科研</option>
        <option value="rest">缓冲</option>
      </select>
    </div>
    <div class="fld"><label>说明</label><textarea id="fDetail" placeholder="怎么做 / 注意什么"></textarea></div>
    <div class="fld"><label>子项清单（一行一条）</label><textarea id="fList" placeholder="可选"></textarea></div>
    <div class="fld">
      <label>资料链接（可加多条，类型按路径自动识别）</label>
      <div id="linkRows"></div>
      <div class="linkadd">
        <button class="qbtn" id="addLinkRow">＋ 添加一条链接</button>
        <span style="font-size:11.5px;color:var(--stone)">快捷插入：</span>
        <span id="linkQuick" style="display:inline-flex;flex-wrap:wrap;gap:6px"></span>
      </div>
    </div>
    <div class="fld"><label>今日产出</label><input id="fOut" placeholder="这块做完要留下什么"></div>
    <div class="mact">
      <button class="danger" id="mDelete" style="display:none">删除这条</button>
      <button type="button" id="mCancel">取消</button>
      <button class="primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<!-- ========== 段落编辑 ========== -->
<div class="mask" id="maskSec">
  <div class="modal">
    <h3 id="sTitle">编辑</h3>
    <p class="mhint" id="sHint"></p>
    <div id="secBody"></div>
    <div class="mact">
      <button type="button" id="sCancel">取消</button>
      <button class="primary" id="sSave">保存</button>

/* ---------------- time ---------------- */
function toMin(t){
  if(!t) return null;
  const m = /^\s*(\d{1,2})\s*[:：]\s*(\d{1,2})\s*$/.exec(String(t));
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function durMin(d){
  if(!d) return 0;
  const s = String(d).replace(/\s/g,"").toLowerCase();
  let m;
  if((m = s.match(/^(\d+)h(\d+)$/))) return (+m[1])*60 + (+m[2]);
  if((m = s.match(/^(\d+(?:\.\d+)?)h$/))) return Math.round(parseFloat(m[1])*60);
  if((m = s.match(/^(\d+)h(\d+)min$/))) return (+m[1])*60 + (+m[2]);
  if((m = s.match(/^(\d+)min$/))) return (+m[1]);
  if((m = s.match(/^(\d+)m$/))) return (+m[1]);
  if((m = s.match(/^(\d+(?:\.\d+)?)$/))) return Math.round(parseFloat(m[1])*60);
  return 0;
}

/* ---------------- data ---------------- */
function bakedItems(k){
  const plan = BAKED[k];

function norm(it){

function withOvr(k, it){

  ["t","d","title","type","detail","out"].forEach(f=>{ if(o[f]!==undefined) c[f]=o[f]; });
  if(o.list!==undefined) c.list = o.list;

  c.edited = true;
  return norm(c);
}
function buildList(k){

    if(!a.after || a.after==="__tail__"){ list.push(a); return; }
    const i = list.findIndex(x=>x.id===a.after);
    if(i>=0) list.splice(i+1,0,a); else list.push(a);
  });
  list.sort(byStart);   /* 按开始时间自动排序；同一时刻保持原有先后 */
  return list;
}
/* 排序：时间早的在前；没有时间的排最后。sort 稳定，同刻按原顺序。 */
function byStart(a,b){
  const sa=toMin(a.t), sb=toMin(b.t);
  if(sa===sb) return 0;
  if(sa===null) return 1;
  if(sb===null) return -1;
  return sa-sb;
}

/* ---------------- 任务文字 → 资料自动匹配 ----------------
   拿 links.json 的 paths（文件名、显示名、别名）去任务文字里找，
   找到对应文件的，就自动挂一个可点的资料链接。 */
const PATH_LIST = (function(){
  const P = (typeof PATHS === "undefined") ? {} : (PATHS || {});
  const out = [];
  Object.keys(P).forEach(k=>{
    const p = P[k] || {};
    const segs = String(p.path||"").split(/[\\/]+/).filter(Boolean);
    const toks = new Set();
    (p.aliases||[]).forEach(a=>{ const s=String(a||"").trim(); if(s.length>=2) toks.add(s); });
    /* 有别名就以别名为准（别名是人工挑过的关键词），避免显示名切出来的碎片误命中 */
    if(!toks.size){
      [p.label, p.short].forEach(s=>String(s||"").split(/[\s　]+/).forEach(w=>{ if(w && w.length>=2) toks.add(w); }));
    }
    segs.forEach(s=>{ const b=s.replace(/\.[A-Za-z0-9]{1,6}$/,""); if(b.length>=2) toks.add(b); });
    out.push({key:k, path:p.path||"", label:p.short||p.label||k, kind:p.kind||"资料", toks:Array.from(toks)});
  });
  return out;
})();
function matchTaskPaths(txt){
  const t = String(txt||"").toLowerCase();
  if(!t) return [];
  const hits = [];
  PATH_LIST.forEach(p=>{
    let best = 0;
    p.toks.forEach(tok=>{
      const s = String(tok).toLowerCase();
      if(s.length < 2) return;
      if(t.indexOf(s) >= 0 && s.length > best) best = s.length;
    });
    if(best > 0) hits.push({p:p, score:best});
  });
  hits.sort((a,b)=> b.score - a.score || a.p.key.localeCompare(b.p.key));
  return hits.slice(0,4).map(x=>x.p);
}
function sameTarget(a, b){
  const x = String((a && (a.path||a.url)) || "").toLowerCase().replace(/[\\/]+$/,"");
  const y = String((b && (b.path||b.url)) || "").toLowerCase().replace(/[\\/]+$/,"");
  return !!x && x === y;
}

/* 未完成且有日期的 DDL 落在哪几天（新增/删除也会实时反映） */
function ddlDates(){

function dayHas(k){

function conflicts(list){
  const info = {};
  list.forEach(it=>{
    const s = toMin(it.t), d = durMin(it.d);
    if(s==null || d<=0) return;
    info[it.id] = {s:s, e:s+d, with:[]};
  });
  const ids = Object.keys(info);
  ids.forEach(a=>ids.forEach(b=>{
    if(a===b) return;
    const A=info[a], B=info[b];
    if(A.s < B.e && B.s < A.e) A.with.push({id:b, t:(list.find(x=>x.id===b)||{}).t});
  }));
  return info;
}

/* ---------------- 竖排日号（收起态）· 歌词式 ----------------
   一列只有数字：滚轮/拖动滑动，中间那一行最清晰（选中日），向两端渐隐。
   滚动停下后自动吸附到最近的一天，并同步中间的时间表。 */
const STRIP_DAYS = 60;
function renderStrip(){
  const base = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  const start = new Date(base); start.setDate(base.getDate()-STRIP_DAYS);
  const dd = ddlDates(), tk = key(TODAY);
  let h = "";
  for(let i=0; i<=STRIP_DAYS*2; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = key(d);
    h += '<button class="sitem'+(k===tk?" today":"")+(dayHas(k)?" has":"")+(dd.has(k)?" due":"")+
         '" data-d="'+k+'" title="'+k+' '+WEEK[d.getDay()]+'">'+
         '<span class="dnum">'+d.getDate()+'</span>'+
         '<span class="dwk">'+WEEK[d.getDay()].replace("周","")+'</span></button>';
  }
  const list = document.getElementById("slist");
  list.innerHTML = h;
  list.querySelectorAll(".sitem").forEach(b=>b.onclick = ()=>setSel(b.dataset.d, true));
  sizeStrip();
  paintStrip();
  requestAnimationFrame(()=>{ sizeStrip(); centerOn(sel, false); fadeStrip(); });
}
function sizeStrip(){
  const list = document.getElementById("slist");
  if(!list) return;
  const item = list.querySelector(".sitem");
  const half = list.clientHeight/2 - (item ? item.offsetHeight/2 : 28);
  list.style.paddingTop = list.style.paddingBottom = Math.max(0, Math.round(half)) + "px";
}
function paintStrip(){
  const list = document.getElementById("slist");
  if(!list) return;
  const tk = key(TODAY);
  list.querySelectorAll(".sitem").forEach(b=>{
    b.classList.toggle("sel", b.dataset.d === sel);
    b.classList.toggle("today", b.dataset.d === tk);
  });
  const lab = document.getElementById("smonth");
  if(lab) lab.textContent = (parseKey(sel).getMonth()+1)+" 月";
  fadeStrip();
  placeBar();
}
/* 竖条纵向跟着选中的那天走（取布局位置，不受缩放影响） */
function placeBar(){
  const list = document.getElementById("slist"), strip = document.getElementById("strip");
  if(!list || !strip || !list.clientHeight) return;
  const el = list.querySelector(".sitem.sel");
  if(!el) return;
  /* 对齐「日期数字」本身：用可见矩形算，绕开 transform 造成的 offsetParent 差异 */
  const num = el.querySelector(".dnum") || el;
  const lr = list.getBoundingClientRect(), nr = num.getBoundingClientRect();
  const y = list.offsetTop + (nr.top + nr.height / 2 - lr.top);
  strip.style.setProperty("--bar-y", y.toFixed(1) + "px");
  /* 收起态：让箭头与这条竖线、这个日期三者同高 */
  const box = document.getElementById("left").getBoundingClientRect();
  document.getElementById("left").style.setProperty("--handle-y", (nr.top + nr.height / 2 - box.top).toFixed(1) + "px");
}
/* 按离中线的距离算清晰度：中间 1，两端 0 */
function fadeStrip(){
  const list = document.getElementById("slist");
  if(!list || !list.clientHeight) return;
  const lr = list.getBoundingClientRect();
  const mid = lr.top + lr.height/2, span = lr.height/2 || 1;
  let near = null, nd = Infinity;
  list.querySelectorAll(".sitem").forEach(b=>{
    const r = b.getBoundingClientRect();
    const dist = Math.abs(r.top + r.height/2 - mid);
    b.style.setProperty("--f", (1 - Math.min(1, dist/span)).toFixed(3));
    if(dist < nd){ nd = dist; near = b; }
  });
  /* 月份标签跟着滚动实时更新：跨月时不会只剩 31、1、2 */
  const lab = document.getElementById("smonth");
  if(lab && near){
    const txt = (parseKey(near.dataset.d).getMonth()+1)+" 月";
    if(lab.textContent !== txt) lab.textContent = txt;
  }
  placeBar();
}
function centerOn(k, smooth){
  const list = document.getElementById("slist");
  if(!list || !list.clientHeight) return;
  const el = list.querySelector('.sitem[data-d="'+k+'"]');
  if(!el) return;
  const top = el.offsetTop - (list.clientHeight - el.offsetHeight)/2;
  if(Math.abs(list.scrollTop - top) < 1.5) return;
  list.scrollTo({top: Math.max(0, top), behavior: smooth ? "smooth" : "auto"});
}
/* 选中某天：只重画中间/日历/右栏，不重建竖条（否则滚动会跳） */
function setSel(k, center){
  if(!k) return;
  sel = k;
  const d = parseKey(k);
  view = new Date(d.getFullYear(), d.getMonth(), 1);
  paintStrip();
  renderMain();
  renderCal();
  renderRight();
  if(center) centerOn(k, true);
}
/* 滚动期间每帧刷新渐隐；停手约 150ms 后吸附到最近的一天。
   吸附走定时器而不是只依赖 scroll 事件——滚轮/拖动时 scroll 事件可能很稀疏甚至丢帧。 */
let stripSettle = 0, stripFadeRAF = 0;
function kickStrip(){
  if(!ui.lc) return;
  if(!stripFadeRAF) stripFadeRAF = requestAnimationFrame(()=>{ stripFadeRAF = 0; fadeStrip(); });
  clearTimeout(stripSettle);
  stripSettle = setTimeout(settleStrip, 150);
}
function settleStrip(){
  const list = document.getElementById("slist");
  if(!list || !list.clientHeight) return;
  const lr = list.getBoundingClientRect(), mid = lr.top + lr.height/2;
  let best = null, bd = Infinity;
  list.querySelectorAll(".sitem").forEach(b=>{
    const r = b.getBoundingClientRect();
    const d = Math.abs(r.top + r.height/2 - mid);
    if(d < bd){ bd = d; best = b; }
  });
  if(!best) return;
  if(best.dataset.d !== sel) setSel(best.dataset.d, true);
  else centerOn(best.dataset.d, true);
}
["scroll","wheel","pointerdown","touchstart","mouseup"].forEach(ev=>
  document.getElementById("slist").addEventListener(ev, kickStrip, {passive:true}));
document.getElementById("slist").addEventListener("keydown", e=>{
  if(e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const d = parseKey(sel);
  d.setDate(d.getDate() + (e.key === "ArrowDown" ? 1 : -1));
  setSel(key(d), true);
});
window.addEventListener("resize", ()=>{ if(ui.lc){ sizeStrip(); fadeStrip(); } });

const TABS = [{id:"ddl", title:"DDL 看板"}, {id:"plan", title:"任务安排"}, {id:"links", title:"常用入口"}];

function ymOf(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||""));
  if(!m) return String(dateStr||"");
  const y = +m[1], mo = +m[2], da = +m[3];
  return (y === TODAY.getFullYear()) ? (mo+"."+da) : (y+"."+mo+"."+da);
}
/* file:// 打开时用构建内的副本 + 本机改动；http:// 打开时以 data/todo.md 为准 */
function ddlList(){
  if(SYNC.ok && SYNC.items){
    const list = SYNC.items.map((d,i)=>({id:"s"+i, baseKey:ddlKey(d), key:ddlKey(d),
      date:d.date||"", task:d.task||"", done:!!d.done, ym:ymOf(d.date)}));
    list.sort((a,b)=> String(a.date||"9999").localeCompare(String(b.date||"9999")));
    return list;
  }
  const src = (edits.ddlLoaded && edits.ddlLoaded.items) ? edits.ddlLoaded.items : DDL;
  const ovr = edits.ddl.ovr || {}, del = new Set(edits.ddl.del || []), done = edits.ddlDone || {};
  const list = src.map((d,i)=>{
    const baseKey = ddlKey(d);
    const o = ovr[baseKey] || {};
    const date = o.date !== undefined ? o.date : (d.date||"");
    const task = o.task !== undefined ? o.task : (d.task||"");
    const k = date+"::"+task;
    return {id:"b"+i, baseKey:baseKey, key:k, date:date, task:task,
            done: done[k] !== undefined ? !!done[k] : !!d.done};
  }).filter(x=>!del.has(x.baseKey));
  (edits.ddl.add||[]).forEach(a=>{
    const k = ddlKey(a);
    list.push({id:a.id, baseKey:k, key:k, date:a.date||"", task:a.task||"",
               done: done[k] !== undefined ? !!done[k] : !!a.done, added:true});
  });
  list.forEach(x=>{ x.ym = ymOf(x.date); });
  list.sort((a,b)=> String(a.date||"9999").localeCompare(String(b.date||"9999")));
  return list;
}
function linksList(){
  const ovr = edits.links.ovr || {}, del = new Set(edits.links.del || []);
  const list = LINKS.map((l,i)=>{
    const id = "l"+i, o = ovr[id] || {};
    return {id:id,
      icon : o.icon  !== undefined ? o.icon  : (l.icon||"\u{1F517}"),
      label: o.label !== undefined ? o.label : (l.label||""),
      url  : o.url   !== undefined ? o.url   : (l.url||""),
      path : o.path  !== undefined ? o.path  : (l.path||""),
      mode : o.mode  !== undefined ? o.mode  : (l.mode||"app")};
  }).filter(l=>!del.has(l.id));
  return list.concat(edits.links.add || []);
}

function planKey(t){ return (t.group||"")+"::"+(t.text||""); }
function planList(){
  if(SYNC.ok && SYNC.plan){
    return SYNC.plan.map((t,i)=>({id:"p"+i, baseKey:planKey(t), key:planKey(t),
      group:t.group||"", text:t.text||"", done:!!t.done}));
  }
  const ovr = edits.plan.ovr || {}, del = new Set(edits.plan.del || []), done = edits.planDone || {};
  const list = TASKS.map((t,i)=>{
    const baseKey = planKey(t);
    const o = ovr[baseKey] || {};
    const group = o.group !== undefined ? o.group : (t.group||"");
    const text  = o.text  !== undefined ? o.text  : (t.text||"");
    const key = group+"::"+text;
    return {id:"b"+i, baseKey:baseKey, key:key, group:group, text:text,
            done: done[key] !== undefined ? !!done[key] : !!t.done};
  }).filter(x=>!del.has(x.baseKey));
  (edits.plan.add||[]).forEach(a=>{
    const key = planKey(a);
    list.push({id:a.id, baseKey:key, key:key, group:a.group||"", text:a.text||"",
               done: done[key] !== undefined ? !!done[key] : !!a.done, added:true});
  });
  return list;
}
/* 分组聚合：分组顺序 = 首次出现顺序；没有分组的排在最前 */
function planGroups(list){
  const groups = [], byName = {};
  list.forEach(x=>{
    const g = x.group || "";
    if(!byName[g]){ byName[g] = {name:g, items:[]}; groups.push(byName[g]); }
    byName[g].items.push(x);
  });
  return groups;
}

/* ---------------- todo.md 同步 ----------------
   serve.py 在 127.0.0.1 上提供 /api/todo：GET 读文件、POST 写文件。
   用 http 打开时以 data/todo.md 为唯一真源；直接双击 HTML（file://）时退化为构建内副本。 */
let SYNC = {ok:false, items:null, plan:null};
function syncEligible(){ return /^https?:$/.test(location.protocol); }
function parseTodoMd(text){
  const out = [];
  String(text||"").split(/\r?\n/).forEach(line=>{
    const m = /^\s*-\s*\[( |x|X)\]\s*(.+?)\s*$/.exec(line);
    if(!m) return;
    const done = m[1].toLowerCase() === "x";
    const rest = m[2];
    let mm = /^(\d{4})\.(\d{1,2})\.(\d{1,2})\s+(.*)$/.exec(rest), y, mo, da, task;
    if(mm){ y = +mm[1]; mo = +mm[2]; da = +mm[3]; task = mm[4]; }
    else{
      mm = /^(\d{1,2})\.(\d{1,2})\s+(.*)$/.exec(rest);
      if(!mm) return;
      y = TODAY.getFullYear(); mo = +mm[1]; da = +mm[2]; task = mm[3];
    }
    out.push({date:y+"-"+pad(mo)+"-"+pad(da), task:task, done:done});
  });
  return out;
}

/* ---------------- tasks.md 同步（任务安排） ----------------
   serve.py 提供 /api/tasks：GET 读 data/tasks.md、POST 写回。
   http:// 打开时以文件为唯一真源；file:// 打开时退化为构建内副本 + 本地覆盖层。 */
function parseTasksMd(text){
  const out = [];
  let group = "";
  String(text||"").split(/\r?\n/).forEach(line=>{
    const s = line.trim();
    if(!s) return;
    if(/^##\s+/.test(s)){ group = s.replace(/^##\s+/,"").trim(); return; }
    if(/^#/.test(s)) return;
    const m = /^-\s*\[( |x|X)\]\s*(.+?)\s*$/.exec(s);
    if(!m) return;
    out.push({group:group, text:m[2], done:m[1].toLowerCase()==="x"});
  });
  return out;
}
function tasksMdText(list){
  const out = ["# 任务安排 · 没有明确 DDL、靠自己推进的事", ""];
  let cur = null;
  list.forEach(t=>{
    const g = t.group || "";
    if(g !== cur){ cur = g; if(g) out.push("## " + g, ""); }
    out.push("- [" + (t.done?"x":" ") + "] " + t.text);
  });
  return out.join("\n") + "\n";
}

/* ---------------- 外部编辑自动感知 ----------------
   agent 等外部工具直接改 data/ 文件时（serve 模式）：
   - todo.md / tasks.md 变了 → 4 秒内自动并入页面（正在编辑则挂起，结束后再应用）
   - 覆盖层（edits.json，页面改动的服务端副本）变了 → 自动采纳（CLI / 另一浏览器写入的）
   - schedule.json 等变了 → 服务端已重建页面，toast 提示刷新查看 */
let lastTodoText = null;
let lastPlanText = null;
let draftSyncApi = null;                       /* draftEl 定义后接线（见文件底部） */
function editingInFlight(){
  const el = document.activeElement;
  if(el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return true;
  return !!document.querySelector(".mask.on");
}
if(syncEligible()){
  let pollBase = null, pendingTodo = null, pendingEdits = null, pendingPlan = null;
  let codeChanged = false, reloadHinted = false;
  function applyTodoText(txt){
    lastTodoText = txt;
    SYNC.ok = true; SYNC.items = parseTodoMd(txt); render();
  }
  function applyPlanText(txt){
    lastPlanText = txt;
    SYNC.ok = true; SYNC.plan = parseTasksMd(txt); render();
  }
  function applyEditsObj(d, mtime){
    editsSuppress = true;
    try{
      edits = Object.assign(emptyEdits(), d || {});
      if(!edits.ddl) edits.ddl = {ovr:{}, add:[], del:[]};
      if(!edits.links) edits.links = {ovr:{}, add:[], del:[]};
      localStorage.setItem(LS_KEY, JSON.stringify(edits));
    }finally{ editsSuppress = false; }
    if(mtime) lastEditsMtime = mtime;
    render();
  }
  function applyPending(){
    if(pendingTodo !== null && !editingInFlight()){
      const txt = pendingTodo; pendingTodo = null;
      if(txt !== lastTodoText) applyTodoText(txt);
    }
    if(pendingPlan !== null && !editingInFlight()){
      const txt = pendingPlan; pendingPlan = null;
      if(txt !== lastPlanText) applyPlanText(txt);
    }
    if(pendingEdits !== null && !editingInFlight()){
      const d = pendingEdits; pendingEdits = null;
      applyEditsObj(d.edits, d.mtime);
    }
    if(draftSyncApi) draftSyncApi.applyPending();
  }
  function pollOnce(){
    if(document.hidden) return;
    fetch("/api/poll", {cache:"no-store"})
      .then(r=>r.json())
      .then(s=>{
        if(pollBase === null){ pollBase = s; return; }   /* 第一次只记基线 */
        if(s.todo !== pollBase.todo){
          pollBase.todo = s.todo;
          fetch("/api/todo", {cache:"no-store"})
            .then(r=> r.ok ? r.text() : Promise.reject())
            .then(txt=>{
              if(txt === lastTodoText || txt === pendingTodo) return;
              if(editingInFlight()) pendingTodo = txt;
              else applyTodoText(txt);
            }).catch(()=>{});
        }
        if(s.tasks !== undefined && s.tasks !== pollBase.tasks){
          pollBase.tasks = s.tasks;
          fetch("/api/tasks", {cache:"no-store"})
            .then(r=> r.ok ? r.text() : Promise.reject())
            .then(txt=>{
              if(txt === lastPlanText || txt === pendingPlan) return;
              if(editingInFlight()) pendingPlan = txt;
              else applyPlanText(txt);
            }).catch(()=>{});
        }
        if(s.edits !== undefined && s.edits !== pollBase.edits){
          pollBase.edits = s.edits;
          if(s.edits === lastEditsMtime) return;         /* 自己刚 POST 的回声 */
          fetch("/api/edits", {cache:"no-store"})
            .then(r=> r.ok ? r.json() : Promise.reject())
            .then(d=>{
              if(!d || JSON.stringify(d.edits) === JSON.stringify(edits)){ if(d) lastEditsMtime = d.mtime; return; }
              if(editingInFlight()) pendingEdits = d;
              else applyEditsObj(d.edits, d.mtime);
            }).catch(()=>{});
        }
        if(s.html !== pollBase.html){
          pollBase.html = s.html;
          toast("日程数据已更新，刷新页面查看");
        }
        /* 前端代码变了（我改了前端但浏览器还跑着旧版本）：自动刷新，
           正在编辑就先等编辑结束，免得把没保存的内容冲掉。 */
        if(s.code && BUILD && s.code !== BUILD){
          codeChanged = true;
          if(!reloadHinted && editingInFlight()){
            reloadHinted = true;
            toast("页面已更新，改完手头的东西会自动刷新");
          }
        }
        if(codeChanged && !editingInFlight()) location.reload();
        if(draftSyncApi) draftSyncApi.onPoll(s);
      }).catch(()=>{});
  }
  setInterval(pollOnce, 4000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ pollOnce(); applyPending(); } });
  document.addEventListener("focusout", applyPending);
  /* 新浏览器 / 清过缓存：本地没有覆盖层而服务端有 → 恢复自己的页面改动 */
  if(!localStorage.getItem(LS_KEY)){
    fetch("/api/edits", {cache:"no-store"})
      .then(r=> r.ok ? r.json() : Promise.reject())
      .then(d=>{
        if(d && d.edits && Object.keys(d.edits).length){
          applyEditsObj(d.edits, d.mtime);
          toast("已从本地服务恢复页面改动");
        }
      }).catch(()=>{});
  }
}

function suggestStart(after){
  const list = buildList(sel);
  const endOf = it => { const s=toMin(it.t), d=durMin(it.d); return (s==null)?null:s+d; };
  if(after==="__head__"){
    const f=list[0]; if(f){ const s=toMin(f.t), d=durMin(f.d); if(s!=null && d>0) return pad(Math.floor(Math.max(0,s-d)/60))+":"+pad(Math.max(0,s-d)%60); }
    return "09:00";
  }
  if(after==="__tail__"){
    const l=list[list.length-1]; if(l){ const e=endOf(l); if(e!=null) return pad(Math.floor(e/60)%24)+":"+pad(e%60); }
    return "20:00";
  }
  const i=list.findIndex(x=>x.id===after);
  if(i>=0){ const e=endOf(list[i]); if(e!=null) return pad(Math.floor(e/60)%24)+":"+pad(e%60); }

/* ---------------- 拖动改时间 ----------------
   在日视图里按住时间块上下拖 = 改开始时间（按 5 分钟吸附）；
   页面自己加的条目改写 edits.adds，文件里的条目写覆盖 edits.ovr。 */
const DRAG_PX_PER_MIN = 2;    /* 拖 2px = 1 分钟（1 小时 = 120px） */
const DRAG_SNAP_MIN  = 5;     /* 吸附到 5 分钟 */
function setItemTime(id, m){
  const it = buildList(sel).find(x=>x.id===id);
  if(!it) return;
  const t = pad(Math.floor(m/60)) + ":" + pad(m%60);
  if(it.src==="user"){
    const arr = edits.adds[sel]||[];
    const j = arr.findIndex(x=>x.id===id);
    if(j<0) return;
    arr[j] = Object.assign({}, arr[j], {t:t});
  }else{
    if(!edits.ovr[sel]) edits.ovr[sel] = {};
    edits.ovr[sel][id] = Object.assign({}, edits.ovr[sel][id]||{}, {t:t});
  }
  saveEdits(); render();
  toast("「"+(it.title||"")+"」时间改为 "+t);
}
function bindDrag(){
  document.querySelectorAll(".cell").forEach(el=>{
    el.addEventListener("pointerdown", e=>{
      if(e.button !== 0) return;
      if(e.target.closest("button,a,input,textarea,select")) return;
      const id = el.dataset.id;
      const it = buildList(sel).find(x=>x.id===id);
      if(!it) return;
      const s0 = toMin(it.t);
      if(s0===null) return;                 /* 没有时间的块不拖 */
      const y0 = e.clientY;
      let moved = false, nt = s0;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      const move = ev=>{
        const dy = ev.clientY - y0;
        if(!moved && Math.abs(dy) < 5) return;
        if(!moved){ moved = true; el.classList.add("dragging"); }
        const dm = Math.round(dy / DRAG_PX_PER_MIN / DRAG_SNAP_MIN) * DRAG_SNAP_MIN;
        nt = Math.max(0, Math.min(23*60+59, s0 + dm));
        const lab = el.querySelector(".tcol b");
        if(lab) lab.textContent = pad(Math.floor(nt/60)) + ":" + pad(nt%60);
      };
      const up = ()=>{
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        el.removeEventListener("pointercancel", up);
        el.classList.remove("dragging");
        if(moved && nt !== s0) setItemTime(id, nt);
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointercancel", up);
    });
  });
}

/* 资料类型徽标：路径/链接能自己说明它是什么，不再让人手选分类 */
const EXT_BADGE = {
  pdf:"PDF", doc:"DOC", docx:"DOC", ppt:"PPT", pptx:"PPT", xls:"XLS", xlsx:"XLS", csv:"CSV",
  md:"MD", txt:"TXT", json:"JSON", html:"HTML", tex:"TEX", py:"PY", ipynb:"IPYNB",
  zip:"ZIP", rar:"ZIP", "7z":"ZIP",
  png:"图片", jpg:"图片", jpeg:"图片", gif:"图片", svg:"图片", webp:"图片",
  mp4:"视频", mov:"视频", mkv:"视频", mp3:"音频", wav:"音频", m4a:"音频"
};
function fileBadge(l){
  const u = String((l && (l.path || l.url)) || "").trim();
  if(!u) return "";
  if(/^https?:/i.test(u)) return "网页";
  if(/^mailto:/i.test(u)) return "邮件";
  const clean = u.replace(/[?#].*$/, "").replace(/[\\/]+$/, "");
  const m = /\.([A-Za-z0-9]{1,6})$/.exec(clean);
  if(!m) return "文件夹";
  const ext = m[1].toLowerCase();
  return EXT_BADGE[ext] || ext.toUpperCase();
}
/* 打开方式：app = 系统默认应用（文件夹→资源管理器，md→默认 markdown 编辑器）；browser = 浏览器打开。
   本地路径（file:// 或手填的 D:\x / \\server\x）在 http 页面统一由下方拦截器交给 /api/open。 */
function linkHref(l){
  if(!l) return "";
  const u = String(l.url||"").trim();
  if(!u) return "";
  if(/^(https?:|mailto:|file:)/i.test(u)) return u;
  /* 手填的本地路径规范成 file:// URL，否则浏览器会把 D:\x 当相对地址解析掉 */
  if(/^[A-Za-z]:[\\/]/.test(u) || /^\\\\/.test(u))
    return "file:///" + encodeURIComponent(u.replace(/\\/g,"/"));
  return u;
}
/* http 模式（serve.py 在跑）时，浏览器不允许网页直接导航本地文件链接，
   交给本地服务用系统默认程序打开；file:// 模式下不拦截，走原生导航。 */
if(/^https?:$/i.test(location.protocol)){
  document.addEventListener("click", function(e){
    const a = e.target.closest && e.target.closest("a[href]");
    if(!a) return;
    const href = a.getAttribute("href") || "";
    let p = null;
    if(/^file:\/\//i.test(href)){
      p = href.replace(/^file:\/\/\/?/i, "");
      try{ p = decodeURIComponent(p); }catch(err){}
    }else if(/^[A-Za-z]:[\\/]/.test(href) || /^\\\\/.test(href)){
      p = href;                                /* 旧数据里存过的裸路径 */
    }
    if(p === null) return;
    e.preventDefault();
    fetch("/api/open", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({path:p})})
      .then(function(r){ return r.json().catch(function(){ return null; }); })
      .then(function(d){
        if(d && d.error) toast(d.error);
        else if(!d || !d.ok) toast("打开失败：本地服务没有在运行");
      })
      .catch(function(){ toast("打开失败：本地服务没有在运行"); });
  });
}

function bindResizer(el, side){
  el.addEventListener("pointerdown", e=>{
    if(side === "l" ? ui.lc : !ui.rc) return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    el.classList.add("dragging");
    document.body.classList.add("col-resizing");
    const x0 = e.clientX;
    const w0 = side === "l" ? ui.lw : ui.rw;
    const move = ev=>{
      const dx = ev.clientX - x0;
      if(side === "l"){
        ui.lw = Math.max(LEFT_MIN, Math.min(LEFT_MAX, Math.round(w0 + dx)));
        app.style.setProperty("--lw", ui.lw + "px");
      }else{
        ui.rw = Math.max(RIGHT_MIN, Math.min(RIGHT_MAX, Math.round(w0 - dx)));
        app.style.setProperty("--rw", ui.rw + "px");
      }
    };
    const up = ()=>{
      el.classList.remove("dragging");
      document.body.classList.remove("col-resizing");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      saveUI();
      if(ui.lc){ sizeStrip(); fadeStrip(); }
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}

/* 草稿 ↔ data/draft.md：页面编辑防抖回写；文件被外部（agent/CLI）改动时自动采纳 */
if(syncEligible()){
  let lastDraft = null, pendingDraft = null, draftTimer = 0;
  function applyDraft(txt){
    lastDraft = txt;
    if(txt !== ui.draft){ ui.draft = txt; draftEl.value = txt; saveUI(); }
  }
  draftSyncApi = {
    onPoll(s){
      if(s.draft === undefined || s.draft === this._mt) return;
      this._mt = s.draft;
      fetch("/api/draft", {cache:"no-store"})
        .then(r=> r.ok ? r.text() : Promise.reject())
        .then(txt=>{
          if(txt === lastDraft || txt === draftEl.value || txt === pendingDraft) return;
          if(editingInFlight() && document.activeElement === draftEl) pendingDraft = txt;
          else applyDraft(txt);
        }).catch(()=>{});
    },
    applyPending(){
      if(pendingDraft !== null && document.activeElement !== draftEl){
        const txt = pendingDraft; pendingDraft = null;
        applyDraft(txt);
      }
    }
  };
  draftEl.addEventListener("input", ()=>{
    clearTimeout(draftTimer);
    draftTimer = setTimeout(()=>{
      const txt = draftEl.value;
      if(txt === lastDraft) return;
      lastDraft = txt;
      fetch("/api/draft", {method:"POST", headers:{"Content-Type":"text/plain; charset=utf-8"},
        body: txt}).catch(()=>{});
    }, 800);
  });
  /* 启动：文件优先；文件不存在时把浏览器里的旧草稿迁移上去 */
  fetch("/api/draft", {cache:"no-store"})
    .then(r=>{ if(r.ok) return r.text(); throw new Error("none"); })
    .then(txt=>{
      lastDraft = txt;
      if(txt !== ui.draft){ ui.draft = txt; draftEl.value = txt; saveUI(); }
    })
    .catch(()=>{
      if(ui.draft){
        lastDraft = ui.draft;
        fetch("/api/draft", {method:"POST", headers:{"Content-Type":"text/plain; charset=utf-8"},
          body: ui.draft}).catch(()=>{});
      }
    });
}

function toast(text){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add("on");

function addMsg(cls, text){
  const d = document.createElement("div");

  chatlog.scrollTop = chatlog.scrollHeight;

  hkPost({pause:true}).then(({d})=>{ hkPaused = true; hkState(d || {}); }).catch(()=>{});
};
hkKeys.addEventListener("keydown", e=>{
  e.preventDefault();
  if(!hkCapture) return;
  if(e.key === "Escape"){ hkCapture = false; hkKeys.placeholder = "Alt+S"; return; }
  const mods = [];
  if(e.ctrlKey) mods.push("Ctrl");
  if(e.altKey) mods.push("Alt");
  if(e.shiftKey) mods.push("Shift");
  if(e.metaKey) mods.push("Win");
  if(["Control","Alt","Shift","Meta","OS","CapsLock","AltGraph"].indexOf(e.key) >= 0) return;
  let key = e.key;
  if(key === " ") key = "Space";
  else if(key.length === 1) key = key.toUpperCase();
  if(!mods.length){ toast("要带上 Ctrl / Alt / Shift / Win 里的至少一个"); return; }
  hkKeys.value = mods.join("+") + "+" + key;
  hkCapture = false;
  hkKeys.placeholder = "Alt+S";
});
document.getElementById("hkSave").onclick = ()=>{
  const keys = hkKeys.value.trim();
  if(!keys){ toast("先点「录制」设一个组合键"); return; }
  hkPost({keys:keys}).then(({ok, d})=>{
    hkPaused = false;
    if(!ok || d.error){ hkHint.textContent = d.error || "保存失败"; toast(d.error || "保存失败"); return; }
    hkState(d);
    toast("快捷键已设为 " + keys);
  }).catch(()=>{ hkHint.textContent = "保存失败，确认 serve.py 在运行"; });
};
/* 关掉设置面板时，如果还停在"已暂停"状态，把系统注册恢复回去 */
MASK_ON_CLOSE["maskCfg"] = ()=>{
  if(!hkPaused) return;
  hkPaused = false;
  hkPost({resume:true}).catch(()=>{});
};

document.getElementById("chatcfg").onclick = ()=>{
  if(!syncEligible()){ addMsg("err", "需要先启动 serve.py"); return; }
  fetch("/api/config").then(r=>r.json()).then(c=>{
    POOL = {active: c.active || "", providers: (c.providers || []).map(p=>Object.assign({}, p))};
    renderPoolSelect();
    fillPoolFields();
    hkLoad();
    maskCfg.classList.add("on");
  }).catch(()=>addMsg("err", "读取配置失败"));
};
document.getElementById("cfgActive").addEventListener("change", e=>{
  stashFields();
  POOL.active = e.target.value;
  fillPoolFields();
});
document.getElementById("cfgAdd").onclick = ()=>{
  stashFields();
  const id = "p" + Date.now();
  POOL.providers.push({id:id, name:"新模型", baseUrl:"https://api.deepseek.com/v1", model:"deepseek-chat", apiKey:"", hasKey:false});
  POOL.active = id;
  renderPoolSelect();
  fillPoolFields();
  document.getElementById("cfgName").focus();
};
document.getElementById("cfgDel").onclick = ()=>{
  const i = poolIndexOf(POOL.active);
  if(i < 0) return;
  POOL.providers.splice(i, 1);
  POOL.active = POOL.providers.length ? POOL.providers[0].id : "";
  renderPoolSelect();
  fillPoolFields();
};
document.getElementById("cfgCancel").onclick = ()=>maskCfg.classList.remove("on");
document.getElementById("cfgSave").onclick = (e)=>{
  e.preventDefault();
  stashFields();
  const payload = {
    active: POOL.active,
    providers: POOL.providers.map(p=>({
      id: p.id, name: p.name || "", baseUrl: p.baseUrl || "",
      model: p.model || "",
      apiKey: p.apiKey || ""            // 空串表示沿用服务端已存的 Key
    }))
  };
  fetch("/api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
    .then(r=>r.json())
    .then(()=>{ maskCfg.classList.remove("on"); toast("模型池已保存"); })
    .catch(()=>addMsg("err", "保存失败，确认 serve.py 在运行"));
};
/* 示例版（构建时带 BAKED_ANCHOR）：把示例数据整体平移到看的人「今天」，
   这样别人什么时候下载都能看到内容，而不是一个空白的日子。 */
if(typeof BAKED_ANCHOR !== "undefined" && BAKED_ANCHOR){
  try{
    const delta = Math.round((parseKey(key(TODAY)) - parseKey(BAKED_ANCHOR)) / 86400000);
    if(delta){
      const moved = {};
      Object.keys(BAKED).forEach(k=>{
        const d = parseKey(k); d.setDate(d.getDate() + delta); moved[key(d)] = BAKED[k];
      });
      Object.keys(BAKED).forEach(k=>{ delete BAKED[k]; });
      Object.assign(BAKED, moved);
      DDL.forEach(d=>{
        if(!d.date) return;
        const t = parseKey(d.date); t.setDate(t.getDate() + delta);
        d.date = key(t);
      });
    }
  }catch(e){}
}

/* ---------------- 快捷键唤起：页面滚回最上方 ----------------
   服务端把日程窗口唤起时会发一个通知，这里收到就把页面拉回顶部。 */
(function bindNotice(){
  if(!syncEligible()) return;
  let lastSeq = null, lastReload = null;
  function scrollTop(){
    try{
      window.scrollTo(0, 0);
      ["main","rbody","lbody","slist","strip"].forEach(id=>{
        const el = document.getElementById(id);
        if(el && el.scrollTop) el.scrollTop = 0;
      });
    }catch(e){}
  }
  function loop(){
    fetch("/api/notice?since="+(lastSeq === null ? 0 : lastSeq), {cache:"no-store"})
      .then(r=>r.json())
      .then(d=>{
        if(lastSeq === null){                 /* 刚打开的页面记下当前状态，不触发刷新 */
          lastSeq = d.seq; lastReload = d.reload || 0;
        }else{
          if(d.seq !== lastSeq){ lastSeq = d.seq; scrollTop(); }
          /* 服务端说前端代码换了 → 自己刷新，免得一直跑着旧版本 */
          if(d.reload && d.reload !== lastReload){
            lastReload = d.reload;
            if(!editingInFlight()) location.reload();
            else toast("页面已更新，改完手头的东西会自动刷新");
          }
        }
        loop();
      })
      .catch(()=>setTimeout(loop, 3000));
  }
  loop();
})();

applyUI();
fillQuickLinks();
render();
syncLoad();
syncLoadPlan();
